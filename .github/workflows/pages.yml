name: Validate and deploy Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SITE_URL: https://www.bncconsulting.nl
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint and type-check
        run: |
          npm run lint
          npm run typecheck
      - name: Install Chromium for accessibility tests
        run: npx playwright install --with-deps chromium
      - name: Run accessibility tests
        run: npm run test:a11y
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
      - name: Test and export site
        run: npm test
      - name: Upload validated static export
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-pages-site
          path: out
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  supabase-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.81.3
      - name: Start disposable Supabase stack and apply migrations
        run: supabase start
      - name: Exercise database integration contracts
        run: supabase test db --local supabase/tests/integration.pgtap.sql
      - name: Stop disposable Supabase stack
        if: always()
        run: supabase stop --no-backup

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: cloudflare-pages
      url: ${{ steps.deploy.outputs.deployment-url }}
    runs-on: ubuntu-latest
    needs: [build, supabase-integration]
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Download validated static export
        uses: actions/download-artifact@v5
        with:
          name: cloudflare-pages-site
          path: out
      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: pages deploy out --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }} --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
