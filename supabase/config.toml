project_id = "clearstep"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000/**"]

[functions.create-checkout]
verify_jwt = true

[functions.stripe-webhook]
verify_jwt = false

[functions.join-waitlist]
verify_jwt = true

[functions.private-workshop-request]
verify_jwt = false

[functions.admin-catalog]
verify_jwt = true

[functions.staff-invite]
verify_jwt = true

[functions.staff-invite-accept]
verify_jwt = true

[functions.google-oauth-start]
verify_jwt = true

[functions.google-oauth-callback]
verify_jwt = false

[functions.automation-worker]
verify_jwt = false

[functions.analytics-ingest]
verify_jwt = false

[functions.auth-send-email-hook]
verify_jwt = false

[functions.customer-requests]
verify_jwt = true
